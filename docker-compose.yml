services:
  app:
    build: .
    container_name: fitihy-cafe-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - config.env
    environment:
      DB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/fitihy_cafe?authSource=admin
    depends_on:
      - mongo
    networks:
      - fitihy-network

  mongo:
    image: mongo:7
    container_name: fitihy-cafe-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - fitihy-network

  mongo-express:
    image: mongo-express:1.0
    container_name: fitihy-cafe-mongo-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - mongo
    networks:
      - fitihy-network

networks:
  fitihy-network:
    driver: bridge

volumes:
  mongo-data:
